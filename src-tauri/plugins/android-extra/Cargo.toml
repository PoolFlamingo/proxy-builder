[package]
name = "tauri-plugin-android-extra"
version = "0.1.0"
description = "Lo que solo hace Android y Tauri no trae: compartir, instalar un APK, pantalla encendida y completa, MulticastLock y abrir ficheros desde otra app. Solo lo llama Rust (src/android.rs)."
edition = "2021"
rust-version = "1.92"
links = "tauri-plugin-android-extra"

[dependencies]
tauri = { version = "2", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
