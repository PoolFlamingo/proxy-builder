[package]
name = "proxy-builder"
version = "2.7.3"
description = "Proxy Builder — decks proxy de Magic: The Gathering listos para imprimir"
authors = ["Pablo"]
edition = "2021"
rust-version = "1.92"

[lib]
# El sufijo `_lib` evita que el nombre de la librería choque con el del
# binario en Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "proxy_builder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# El núcleo puro (`crates/proxy-core`: parser, geometría, imagen y PDF) vive en
# su propio crate, sin Tauri, sin red y sin base de datos, para probarlo en
# segundos con `cargo test -p proxy-core`. Mismo patrón que `crates/ai` en
# judlex. Los perfiles van aquí, en la raíz: en un workspace solo cuentan éstos.
[workspace]
members = [".", "crates/proxy-core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
proxy-core = { path = "crates/proxy-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
# La biblioteca local (decks, cartas, presets, ajustes, caché de Scryfall).
# `bundled`: SQLite compilado dentro, igual en las tres plataformas.
rusqlite = { version = "0.40", features = ["bundled"] }
# Huella de cada imagen del almacén de blobs.
sha2 = "0.11"
uuid = { version = "1", features = ["v4"] }
# Red: Scryfall y Archidekt. 🛑 `default-features = false` y `rustls`: nada de
# OpenSSL en el árbol (regla de judlex). Tras tocarlo, `cargo tree -i openssl`
# tiene que salir vacío.
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "gzip"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# Los parámetros de render viajan en la URL de la miniatura en base64url.
base64 = "0.22"
rayon = "1.12"
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
# Registro de lo que hace la app (cada petición de red queda apuntada).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# Paquetes `.pbdeck`. Solo deflate (en Rust puro); nada de cifrado ni de los
# demás compresores.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# OCR opcional del nombre de las cartas propias (Rust puro; los modelos se
# descargan la primera vez que se usa, ver `ocr.rs`).
ocrs = { version = "0.13", default-features = false, features = ["rten"] }
rten = { version = "0.26", default-features = false }
image = { version = "0.25.10", default-features = false }
# La memoria del equipo, para el tope de las búsquedas recordadas (solo eso).
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
# Fuentes de cartas aparte de Scryfall (`fuentes/`): el catálogo de fichas de
# Cockatrice es XML, y las imágenes de fuera se miden antes de decodificarlas.
# Las dos ya venían en el árbol (por usvg y por proxy-core).
roxmltree = "0.21"
imagesize = "0.14"
# Actualizaciones dentro de la app (`actualizar.rs`). Solo la usa Rust: busca
# en el `latest.json` del último release de GitHub, comprueba la firma
# (minisign, clave pública en `tauri.conf.json`) y lo instala. Usa el mismo
# reqwest 0.13 con rustls que el resto (nada de OpenSSL).
tauri-plugin-updater = "2"

[dev-dependencies]
tempfile = "3"
lopdf = "0.45"
tokio = { version = "1", features = ["rt", "macros", "time", "test-util"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Recuerda tamaño, posición y si estaba maximizada.
tauri-plugin-window-state = "2"

# «Pegar» en el editor de cartas: la imagen del portapapeles la lee Rust
# (`diseno/portapapeles.rs`), porque WebKitGTK no deja leerla a la vista web.
# En Linux, el GTK que ya trae Tauri; en Windows y macOS, arboard.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
arboard = { version = "3", default-features = false, features = ["image-data"] }

# ─────────────────────────────────────────────────────────────────────────────
# Perfiles (copiados de judlex con su motivo)
# ─────────────────────────────────────────────────────────────────────────────
#
# 🛑 El debuginfo del perfil dev va EMPAQUETADO. En judlex `target` llegó a
# pesar 115,9 GB porque, con `split-debuginfo = "unpacked"` (lo de fábrica en
# macOS), rustc deja el DWARF en objetos sueltos que Cargo nunca barre. Con
# estas líneas se queda en unos pocos GB y además compila más rápido.
# Al tocarlas, `cargo clean` primero.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "packed"

[profile.dev.package."*"]
debug = false

# Las dependencias de imagen se compilan optimizadas también en desarrollo:
# procesar una carta a 600 PPP sin optimizar tarda segundos en vez de
# milisegundos, y eso hace inservible la vista previa en `tauri dev`.
opt-level = 2

[profile.dev.build-override]
debug = false
