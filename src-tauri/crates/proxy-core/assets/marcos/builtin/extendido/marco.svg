<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 63 88" width="63" height="88">
<defs>{{defs}}</defs>
<!-- El negro empieza donde acaba la ilustración (más abajo con la
     extensión del difuminado). Mitad de abajo: marco del color de la carta, barra de tipo y caja clara. -->
<rect x="-1" y="{{= 51.4 - subeCaja + extensionArte}}" width="65" height="{{= 37.6 + subeCaja}}" fill="#000"/>
<rect x="2.1" y="{{= 51.5 - subeCaja}}" width="58.8" height="{{= 31.6 + subeCaja}}" rx="1.0" fill="url(#marco)"/>
<rect x="2.1" y="{{= 51.5 - subeCaja}}" width="58.8" height="{{= 31.6 + subeCaja}}" rx="1.0" fill="url(#lateral)"/>
<rect x="3.55" y="{{= 56.25 - subeCaja}}" width="55.75" height="{{= 26.6 + subeCaja}}" fill="url(#crema)" stroke="{{oscuro}}" stroke-width="0.25"/>
<rect x="2.35" y="{{= 51.45 - subeCaja}}" width="58.3" height="4.75" rx="1.4" fill="url(#marco)"/>
<rect x="2.35" y="{{= 51.45 - subeCaja}}" width="58.3" height="4.75" rx="1.4" fill="url(#brillo)"/>
<rect x="2.95" y="{{= 51.85 - subeCaja}}" width="57.1" height="3.95" rx="1.0" fill="#141414"/>
<!-- Barra del título, clara. -->
<rect x="2.05" y="2.65" width="59.0" height="6.3" rx="1.8" fill="url(#marco)" stroke="#000" stroke-opacity="0.5" stroke-width="0.12"/>
<rect x="2.05" y="2.65" width="59.0" height="6.3" rx="1.8" fill="url(#brillo)"/>
<rect x="3.55" y="3.55" width="56.0" height="4.6" rx="1.2" fill="url(#crema)" stroke="{{oscuro}}" stroke-width="0.12"/>
</svg>
