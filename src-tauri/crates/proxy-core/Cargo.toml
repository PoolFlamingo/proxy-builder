[package]
name = "proxy-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Núcleo puro de Proxy Builder: modelo, geometría de página, parser de listas, imagen y PDF"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = "12"
regex = "1"
# Leer formato y medidas de una imagen sin decodificarla (la misma que usa krilla).
imagesize = "0.14"
# Decodificar y codificar imágenes (solo los formatos que se usan).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff", "bmp", "rayon"] }
# Remuestreo Lanczos3 con SIMD (mucho más rápido que el de `image`).
fast_image_resize = { version = "6.1.0", features = ["rayon"] }
rayon = "1.12"
sha2 = "0.11"
# El PDF, como en judlex: determinista, fuentes en subconjunto, sin nada
# nativo. `raster-images` para incrustar las cartas (el JPEG va tal cual,
# con DCTDecode); `simple-text` para las etiquetas de la hoja de calibración.
krilla = { version = "0.8.2", default-features = false, features = ["raster-images", "simple-text"] }
parley = { version = "0.12", default-features = false, features = ["std"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
resvg = { version = "0.48", default-features = false }
skrifa = { version = "0.44", default-features = false, features = ["std"] }

[dev-dependencies]
lopdf = "0.45"
