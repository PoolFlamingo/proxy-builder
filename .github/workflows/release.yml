# Instaladores de Linux, Windows y macOS (Fase 9). Se lanza a mano (pestaña
# Actions → release → Run workflow) y deja los ficheros en un borrador de
# release con la etiqueta `v<versión de tauri.conf.json>`.
#
# 🛑 Solo a mano, no al subir etiquetas: publicar el borrador crea la etiqueta,
# y con el disparador de etiquetas eso volvía a compilarlo todo (13/10/2026).
# Sin firma de código en v1: Windows SmartScreen y Gatekeeper avisarán (README).
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Librerías de Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "Proxy Builder v__VERSION__"
          releaseBody: "Instaladores de Proxy Builder. Sin firma de código: ver el README."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
