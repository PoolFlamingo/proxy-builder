# Instaladores de Linux, Windows y macOS (Fase 9). Se lanza a mano (pestaña
# Actions → release → Run workflow) y deja los ficheros en un borrador de
# release con la etiqueta `v<versión de tauri.conf.json>`.
#
# 🛑 Solo a mano, no al subir etiquetas: publicar el borrador crea la etiqueta,
# y con el disparador de etiquetas eso volvía a compilarlo todo (13/10/2026).
# Sin firma de código en v1: Windows SmartScreen y Gatekeeper avisarán (README).
#
# Actualizaciones dentro de la app (`src-tauri/src/actualizar.rs`): con
# `createUpdaterArtifacts` cada instalador sale firmado (`.sig`, minisign) y
# tauri-action junta en `latest.json` una entrada por instalador
# (`linux-x86_64-deb`, `windows-x86_64-nsis`, `darwin-aarch64-app`…). La app lo
# lee de `releases/latest/download/latest.json`: solo cuenta al publicar el
# borrador. 🛑 Sin el secreto `TAURI_SIGNING_PRIVATE_KEY` (la clave privada de
# `~/.tauri/proxy-builder.key`, sin contraseña) `tauri build` falla.
#
# El APK de Android (trabajo `android`): solo `aarch64`, firmado con la clave de
# Android de Pablo (secretos `ANDROID_KEY_ALIAS`, `ANDROID_KEY_PASSWORD` y
# `ANDROID_KEY_BASE64`: el `.jks` en base64) y, aparte, con la clave del
# actualizador (`tauri signer sign`, el mismo secreto que el escritorio) para
# su `.sig`. Se sube al mismo borrador, por eso espera a `build` (que es quien
# lo crea). 🛑 NO toca `latest.json`: los trabajos de escritorio lo reescriben
# en paralelo y se pisarían. La entrada `android-aarch64` la añade
# `scripts/release.mjs` (en el equipo de Pablo) leyendo el `.sig`.
# 🛑 La clave de Android no se pierde ni se cambia nunca: Android no instala un
# APK firmado con otra clave encima de otro, y desinstalar borra la biblioteca.
name: release

on:
  workflow_dispatch:
    inputs:
      solo_android:
        description: "Solo el APK de Android (el borrador ya tiene los instaladores de escritorio)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    # Con «solo_android» no se recompila el escritorio: el borrador ya lo trae.
    if: ${{ !inputs.solo_android }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Librerías de Tauri (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Proxy Builder v__VERSION__"
          releaseBody: "Instaladores de Proxy Builder. Sin firma de código: ver el README."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  android:
    # El borrador de la release lo crea `tauri-action` en `build` (o ya existe,
    # con «solo_android»: entonces `build` sale saltado).
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-24.04
    env:
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          # Por defecto instala `tools`, que Google ya no publica y hace fallar
          # el paso («Failed to find package 'tools'»). Lo demás va en el paso siguiente.
          packages: platform-tools

      - name: SDK y NDK de Android
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Clave de firma de Android
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEY_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD y ANDROID_KEY_BASE64: un APK sin firmar no se instala."
            exit 1
          fi
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/android.jks"
          # Se comprueba ya, en segundos, que el secreto abre el almacén (si no, el
          # fallo llega tras 17 minutos de compilación: «keystore password was incorrect»).
          if ! salida=$(keytool -list -keystore "$RUNNER_TEMP/android.jks" -storepass:env ANDROID_KEY_PASSWORD -alias "$ANDROID_KEY_ALIAS" 2>&1); then
            # Lo que dice keytool no lleva la contraseña (GitHub enmascara los secretos).
            echo "keytool: $salida"
            echo "Tamaño del .jks: $(wc -c < "$RUNNER_TEMP/android.jks") bytes"
            echo "::error::ANDROID_KEY_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_BASE64 no encajan (el mensaje de keytool está arriba: contraseña incorrecta, alias que no existe o fichero que no es un .jks)."
            exit 1
          fi
          # `keystore.properties` es un fichero de propiedades de Java: una `\` de la
          # contraseña sería un escape, así que se duplica.
          clave_escapada=$(printf '%s' "$ANDROID_KEY_PASSWORD" | sed 's/\\/\\\\/g')
          {
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'password=%s\n' "$clave_escapada"
            printf 'storeFile=%s\n' "${RUNNER_TEMP}/android.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Compilar el APK (arm64)
        # Sin símbolos en la librería de Rust: de 100 MB a 72 MB (el APK la guarda
        # sin comprimir). Solo aquí: los binarios de escritorio no cambian.
        env:
          CARGO_PROFILE_RELEASE_STRIP: symbols
        run: pnpm tauri android build --apk --target aarch64 --ci

      - name: Nombre, firma y comprobaciones
        id: apk
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          SALIDA=src-tauri/gen/android/app/build/outputs/apk
          mapfile -t APKS < <(find "$SALIDA" -name '*.apk' -path '*release*')
          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "::error::Esperaba un solo APK de release en $SALIDA y hay ${#APKS[@]}: ${APKS[*]}"
            exit 1
          fi
          case "${APKS[0]}" in *unsigned*) echo "::error::El APK ha salido sin firmar: ${APKS[0]}"; exit 1;; esac
          APK="Proxy-Builder_${VERSION}_android-arm64.apk"
          cp "${APKS[0]}" "$APK"
          BT="${ANDROID_HOME}/build-tools/36.0.0"
          "$BT/apksigner" verify --print-certs "$APK"
          # Tauri saca el versionCode de la versión: mayor*1000000 + menor*1000 + parche.
          IFS=. read -r MA MI PA <<< "$VERSION"
          ESPERADO=$((MA * 1000000 + MI * 1000 + PA))
          INSIGNIA=$("$BT/aapt" dump badging "$APK" | grep -m1 '^package:')
          echo "$INSIGNIA"
          case "$INSIGNIA" in *"versionCode='${ESPERADO}'"*) ;; *) echo "::error::El versionCode no es ${ESPERADO}"; exit 1;; esac
          # La firma del actualizador, atada a la versión (`requireSignedVersion`).
          pnpm tauri signer sign --app-version "$VERSION" "$APK"
          test -s "$APK.sig"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Subir al borrador (sin tocar latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ steps.apk.outputs.version }}" \
            "${{ steps.apk.outputs.apk }}" "${{ steps.apk.outputs.apk }}.sig" \
            --clobber --repo "${{ github.repository }}"

      - name: Borrar la clave
        if: always()
        run: rm -f "$RUNNER_TEMP/android.jks" src-tauri/gen/android/keystore.properties
