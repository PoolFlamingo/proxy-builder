# Fallos conocidos en las dependencias, una vez por semana y aparte del CI: un
# aviso nuevo de una dependencia no pone en rojo un push que no ha tocado nada ni
# frena una release. Las excepciones, con su porqué, en `src-tauri/.cargo/audit.toml`.
name: auditoria

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
        working-directory: src-tauri
  npm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm audit --prod
