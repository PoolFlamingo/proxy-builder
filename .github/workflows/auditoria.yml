# Fallos conocidos en las dependencias, una vez por semana y aparte del CI: un
# aviso nuevo de una dependencia no pone en rojo un push que no ha tocado nada ni
# frena una release. Las excepciones, con su porqué, en `src-tauri/.cargo/audit.toml`.
name: auditoria

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo install cargo-audit --locked --version 0.22.2
      - run: cargo audit
        working-directory: src-tauri
  npm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: pnpm audit --prod
