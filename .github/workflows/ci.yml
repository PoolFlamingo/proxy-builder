# Las mismas puertas que en local (CLAUDE.md), en cada push y pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Los .deb se cachean: el mirror de Ubuntu a veces baja a ~50 kB/s y esos
      # 55 MB tardaban hasta 20 minutos (el resto del CI son ~3).
      - name: Librerías de Tauri
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1
        with:
          packages: libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          version: 1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm check:rust-fmt
      - run: pnpm check:clippy
      - run: pnpm test:rust
      - name: Sin OpenSSL en el árbol
        run: "! cargo tree --manifest-path src-tauri/Cargo.toml -i openssl 2>/dev/null"
