# 🛑 Las versiones de cargo y npm no las sube Dependabot por su cuenta
# (`open-pull-requests-limit: 0`): solo abre PR de seguridad, que además hay que
# activar en Settings > Code security. Un lockfile de npm hecho con otro pnpm
# rompe el `pnpm install` de Pablo (CLAUDE.md), así que un PR de estos se revisa.
# Las acciones van fijadas por SHA: sin esto, sus parches de seguridad no llegan.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      acciones:
        patterns: ["*"]
